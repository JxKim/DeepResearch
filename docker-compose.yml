services:
  mongo:
    image: docker.m.daocloud.io/library/mongo:7.0
    container_name: deep-research-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: deepresearch_root
      MONGO_APP_USERNAME: deepresearch
      MONGO_APP_PASSWORD: deepresearch_dev
    volumes:
      - deep-research-mongo-data:/data/db
      - ./mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

  redis:
    image: docker.m.daocloud.io/library/redis:7.2
    container_name: deep-research-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - infini_rag_flow
      - --appendonly
      - "yes"
    volumes:
      - deep-research-redis-data:/data

volumes:
  deep-research-mongo-data:
  deep-research-redis-data:
